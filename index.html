ll the others. He waits for that moment, and for the frame that can hold it.\n\nLebanon holds a central place in his work. The warmth of the country is his strongest source of inspiration, at the heart of the series In another life, Beirut. Paris, ongoing is an open-ended body of work on the city where he lives. Other series take him further afield: Brazil in Alegria, the Mediterranean in Salt in the air and, in contrast to the warmth of Lebanon, the cold of Armenia in Pale sun. With Endless Days, they form a body of work that is still growing.\n\nHe works in both film and digital. Among the photographers who matter most to him, two hold a particular place: Alex Webb, for his dense, colour-saturated frames, and Josef Koudelka, for a life spent photographing on the move."}}, "meta": {"featured": {"ids": ["pq2wtpi18muny94d5"]}}};

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --bg:#ffffff;
    --text:#111111;
    --text-dim:#5e5e5e;
    --border:#e5e5e2;
    --hover-bg:#f5f5f3;
    --accent:#b4472a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Figtree','Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
  }
  /* ── Sidebar ── */
  #sidebar{
    width:168px;
    flex-shrink:0;
    position:fixed;
    top:0; left:0;
    height:100vh;
    overflow-y:auto;
    padding:32px 20px 36px 22px;
    z-index:10;
    background:var(--bg);
  }
  main{ margin-left:168px; }
  .sidebar-name{
    font-family:'Figtree','Inter',sans-serif;
    font-style:normal;
    font-weight:400;
    font-size:0.92rem;
    line-height:1.4;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-bottom:40px;
    cursor:pointer;
    background:none;
    border:none;
    color:var(--text);
    padding:0;
    text-align:left;
    display:block;
    width:100%;
  }
  .snav{ display:flex; flex-direction:column; }
  .snav-link{
    background:none;
    border:none;
    text-align:left;
    font-family:'Figtree','Inter',sans-serif;
    font-size:0.79rem;
    color:var(--text-dim);
    cursor:pointer;
    padding:3.5px 0;
    width:100%;
    transition:color 0.15s;
  }
  .snav-link:hover{ color:var(--text); }
  .snav-link.active{ color:var(--text); font-weight:500; }
  .snav-section{ margin:8px 0 2px 0; }
  .snav-section-title{ display:none; }
  .snav-series-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    text-align:left;
    width:100%;
    padding:3.5px 0;
    font-family:'Figtree','Inter',sans-serif;
    font-weight:400;
    font-size:0.79rem;
    color:var(--text-dim);
    cursor:pointer;
    transition:color 0.15s;
    line-height:1.35;
  }
  .snav-series-btn:hover{ color:var(--text); }
  .snav-series-btn.active{ color:var(--text); font-weight:500; }
  .snav-series-btn.active::before{
    content:'·';
    position:absolute;
    left:-10px;
    color:var(--text);
    font-weight:700;
    font-size:0.9rem;
    line-height:1;
    top:50%;
    transform:translateY(-50%);
  }
  .snav-series-btn{ position:relative; }
  .s-thumb{ display:none !important; }
  .snav-divider{
    border:none;
    border-top:1px solid var(--border);
    margin:12px 0;
  }
  .snav-social{
    display:flex;
    gap:14px;
    align-items:center;
    margin-top:20px;
    padding-left:1px;
  }
  .snav-social a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:var(--text-dim);
    text-decoration:none;
    transition:color 0.18s ease;
    opacity:0.65;
  }
  .snav-social a:hover{
    color:var(--text);
    opacity:1;
  }
  .snav-social svg{
    width:14px;
    height:14px;
  }
  .social-copy-btn{
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    color:var(--text-dim);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    opacity:0.65;
    transition:color 0.18s ease, opacity 0.18s ease;
  }
  .social-copy-btn:hover{ color:var(--text); opacity:1; }
  .copy-confirm{
    font-family:'Figtree','Inter',sans-serif;
    font-size:0.6rem;
    font-weight:400;
    letter-spacing:0.06em;
    color:var(--accent);
    opacity:0;
    transition:opacity 0.2s ease;
    pointer-events:none;
    user-select:none;
  }
  .copy-confirm.show{ opacity:1; }
  /* ── Main ── */
  main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  #content{
    opacity:1;
    transition:opacity 0.18s ease;
  }
  #content.fading{ opacity:0; }
  .series-title{ display:none; }
  .stack{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .stack{ display:none; }
  .carousel-header{ display:none; }
  .carousel{
    position:relative;
    width:100%;
    height:100vh;
    min-height:400px;
    background:var(--bg);
    user-select:none;
    -webkit-user-select:none;
  }
  /* Zones de clic directionnel */
  .carousel-zone{
    position:absolute;
    top:0; bottom:0;
    width:50%;
    z-index:3;
  }
  .carousel-zone.left{
    left:0;
    cursor:w-resize;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding-left:32px;
  }
  .carousel-zone.right{
    right:0;
    cursor:e-resize;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:32px;
  }

  /* Dots — masqués, navigation par zones */
  .c-dots{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    align-items:center;
    z-index:5;
    pointer-events:none;
  }
  .c-dot{
    width:4px;
    height:4px;
    border-radius:50%;
    background:rgba(255,255,255,0.35);
    transition:background 0.25s ease, transform 0.25s ease;
    flex-shrink:0;
  }
  .c-dot.on{
    background:rgba(255,255,255,0.92);
    transform:scale(1.25);
  }
  .c-counter{
    position:absolute;
    bottom:18px;
    right:24px;
    z-index:5;
    color:rgba(255,255,255,0.38);
    font-family:'Figtree','Inter',sans-serif;
    font-size:0.65rem;
    font-weight:300;
    letter-spacing:0.08em;
    pointer-events:none;
    user-select:none;
  }

  .cframe{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    padding:5vh 2vw 5vh 5vw;
    opacity:0;
    transition:opacity 0.85s cubic-bezier(0.45,0.05,0.25,1);
    pointer-events:none;
    will-change:opacity;
  }
  .cframe.prev{ opacity:1; z-index:0; transition:none; }
  @media (prefers-reduced-motion: reduce){ .cframe{ transition-duration:0.01s; } }
  .cframe.current{
    opacity:1;
    z-index:1;
  }
  .cframe img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    display:block;
    image-rendering:auto;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .carousel > .remove{
    position:absolute;
    top:16px;
    right:16px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(255,255,255,0.92);
    border:1px solid var(--border);
    color:var(--text);
    cursor:pointer;
    font-size:1rem;
    opacity:0;
    transition:opacity 0.15s ease;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .carousel:hover > .remove{ opacity:1; }
  .cframe .star, .cframe .remove{ }
  .carousel-bar{
    position:absolute;
    bottom:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:12px;
    padding:8px 32px 16px 32px;
    height:52px;
    background:transparent;
    opacity:0;
    transition:opacity 0.22s ease;
    z-index:4;
  }
  .carousel:hover .carousel-bar{ opacity:1; }
  .carousel-count{ display:none; }
  /* Réorganisation cachée par défaut */
  .reorder-group{ opacity:0; transition:opacity 0.2s; }
  .carousel-bar:hover .reorder-group{ opacity:1; }
  .add-btn{
    background:none;
    border:1px solid rgba(255,255,255,0.3);
    color:rgba(255,255,255,0.7);
    font-family:'Figtree','Inter',sans-serif;
    font-size:0.72rem;
    padding:6px 12px;
    border-radius:2px;
    letter-spacing:0.04em;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-btn:hover{ border-color:rgba(255,255,255,0.8); color:#fff; }
  .add-btn.error{ border-color:#ff6b6b; color:#ff6b6b; font-size:0.72rem; }
  .reorder-group{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .reorder-btn{
    background:none;
    border:1px solid rgba(255,255,255,0.3);
    color:rgba(255,255,255,0.7);
    font-size:1rem;
    width:28px;
    height:28px;
    border-radius:2px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    padding:0;
    transition:border-color 0.15s, color 0.15s;
  }
  .reorder-btn:hover:not(:disabled){ border-color:#fff; color:#fff; }
  .reorder-btn:disabled{ opacity:0.25; cursor:default; }
  .frame{
    position:relative;
    width:100%;
  }
  .frame img{
    width:100%;
    height:auto;
    display:block;
  }
  .frame .remove{
    position:absolute;
    top:16px;
    right:16px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    border:1px solid var(--border);
    color:var(--text);
    cursor:pointer;
    font-size:1rem;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .frame .star{
    position:absolute;
    top:16px;
    right:54px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    border:1px solid var(--border);
    color:var(--text);
    cursor:pointer;
    font-size:0.95rem;
    opacity:0;
    transition:opacity 0.15s ease;
  }
  .frame .star.on{
    opacity:1;

  }
  .frame:hover .remove, .frame:hover .star, .frame:hover .frame-no{ opacity:1; }

  .hero-caption{
    position:absolute;

  .add-frame{

  .add-frame .plus{ font-size:1.8rem; font-weight:300; line-height:1; }
  .add-frame span.label{ font-size:0.8rem; }
  input[type=file]{ display:none; }
  .empty-note{

    font-size:0.82rem;

  /* ── Splash ── */
  #splash{

    justify-content:center;

  }

  /* ── Curseur v2 : anneau-loupe ── */
  #czCursor{
    width:54px !important; height:54px !important; margin:-27px 0 0 -27px !important;

    display:flex; align-items:center; justify-content:center;

  #czCursor svg{ position:relative; filter:drop-shadow(0 0 1px rgba(0,0,0,0.35)); }

<script>
const SERIES = [
  "Lebnen ya lebnen",
  "Paris, ongoing",
  "Alegria",
  "Salt in the air",
  "Pale sun",
  "Endless Days",
  "Before it ends"
];
// Nom affiché d'une série (la clé interne ne change pas, les photos restent liées)
const SERIES_LABELS = { "Lebnen ya lebnen": { title: "In another life, Beirut" } };
function seriesTitle(k){ return (SERIES_LABELS[k] && SERIES_LABELS[k].title) || k; }
function seriesPlace(k){ return (SERIES_LABELS[k] && SERIES_LABELS[k].place) || ''; }

const MAX_DIM = 2200;
const JPEG_QUALITY = 0.90;
let currentKey = SERIES[0];

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
// ── Artifact runtime storage (assets + db) ───────────────────────────────────
let _assets = null;
let _db = null;
let _canWrite = false;

async function initStorage(){
  try{
    [_assets, _db] = await Promise.all([
      claude.use('assets'),
      claude.use('db')
    ]);
    _canWrite = _assets !== null;
  } catch(e){ console.warn('Storage init', e); }
}

async function loadPhotos(seriesName){
  if (!_db) return [];
  try{
    const snap = await _db.collection('photos').where('series','==',seriesName).get();
    const docs = snap.docs.map(d => d.data());
    docs.sort((a,b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));
    return docs;
  } catch(e){ return []; }
}

async function resizeToBlob(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > MAX_DIM){ height = Math.round(height * MAX_DIM / width); width = MAX_DIM; }
      if (height > MAX_DIM){ width = Math.round(width * MAX_DIM / height); height = MAX_DIM; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/jpeg', JPEG_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img load')); };
    img.src = url;
  });
}

async function renderHome(){

  content.innerHTML = '<div class="hero" id="hero"><div class="hero-empty">Ajoute des photos dans tes séries pour qu\'elles défilent ici.</div></div>';

  if (currentKey !== '__home__') return;

  const byId = {};
  allLists.forEach(list => list.forEach(p => { byId[p.id] = p; }));

  // Priority 1: starred photos
  let pool = featuredIds.map(id => byId[id]).filter(Boolean);

  // Priority 2: pick up to 3 photos from each series that has photos (varied, shuffled within each)
  if (pool.length === 0) {
    const perSeries = [];
    allLists.forEach(list => {
      if (list.length === 0) return;
      const shuffled = [...list].sort(() => Math.random() - 0.5);
      perSeries.push(...shuffled.slice(0, 3));
    });
    // Interleave by series position to maximise variety
    pool = perSeries.sort(() => Math.random() - 0.5).slice(0, 15);
  }
  if (pool.length === 0) return;

  const hero = document.getElementById('hero');
  hero.innerHTML = '';
  pool.forEach(p => {
    const slide = document.createElement('div');
    slide.className = 'hero-slide';
    const img = document.createElement('img');
    img.src = p.src;
    img.draggable = false;
    slide.appendChild(img);
    hero.appendChild(slide);
  });



  const slides = hero.querySelectorAll('.hero-slide');
  let i = 0;
  slides[0].classList.add('current');

  function show(idx){
    slides.forEach((sl, k) => {
      const img = sl.querySelector('img');
      if (k === idx){
        sl.classList.add('current');
        img.style.animation = 'none';
        img.offsetHeight;
        img.style.animation = '';
      } else {
        sl.classList.remove('current');
      }
    });
  }

  if (slides.length > 1){
    heroTimer = setInterval(() => {
      i = (i + 1) % slides.length;
      show(i);
    }, 9000);
  }
}

function renderCarousel(seriesName, photos){
  const carousel = document.getElementById('carousel');
  if (!carousel) return;
  let index = 0;

  function draw(){
    // Ne supprime que les frames photo, pas les zones/dots de navigation
    Array.from(carousel.children).forEach(c => {
      if (!c.classList.contains('carousel-zone') && !c.classList.contains('c-dots') && !c.classList.contains('carousel-bar') && !c.classList.contains('c-counter')) c.remove();
    });
    if (photos.length === 0){
      const empty = document.createElement('div');
      empty.className = 'hero-empty';
      empty.style.minHeight = '300px';
      empty.textContent = 'Aucune photo pour l\'instant. Utilise "Ajouter une photo" ci-dessous.';
      carousel.insertBefore(empty, carousel.querySelector('.c-dots'));
      document.getElementById('carouselCount').textContent = '';
      return;
    }

    photos.forEach((photo, i) => {
      const frame = document.createElement('div');
      frame.className = 'cframe';
      if (i === index) frame.classList.add('current');
      const img = document.createElement('img');
      img.src = photo.src;
      img.alt = seriesName + ' ' + (i + 1);
      img.draggable = false;
      img.decoding = 'async';
      frame.appendChild(img);

      if (i === index){
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove';
        removeBtn.textContent = '×';
        let confirmPending = false;
        let confirmTimer = null;
        removeBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!confirmPending){
            confirmPending = true;
            removeBtn.textContent = '?';
            removeBtn.style.background = '#ff4444';
            removeBtn.style.color = '#fff';
            removeBtn.style.borderColor = '#ff4444';
            confirmTimer = setTimeout(() => {
              confirmPending = false;
              removeBtn.textContent = '×';
              removeBtn.style.background = '';
              removeBtn.style.color = '';
              removeBtn.style.borderColor = '';
            }, 2500);
            return;
          }
          clearTimeout(confirmTimer);
          const delIdx = index;
          const photo = photos[delIdx];
          await removePhoto(photo.id, photo.assetId);
          photos = photos.filter((_, k) => k !== delIdx);
          if (index >= photos.length) index = Math.max(0, photos.length - 1);
          draw();
        });
        carousel.appendChild(removeBtn);
      }
      // Insérer avant les zones de navigation (toujours en dernier dans le DOM)
      const firstZone = carousel.querySelector('.carousel-zone');
      if (firstZone) carousel.insertBefore(frame, firstZone);
      else carousel.appendChild(frame);
    });

    document.getElementById('carouselCount').textContent = (index + 1) + ' / ' + photos.length;
    if(typeof updateNav === 'function') updateNav();
  }

  // Fondu enchaîné : la nouvelle image se fond par-dessus la précédente
  let prevTimer = null;
  let goToken = 0;
  function go(n){
    if (photos.length < 2) return;
    n = (n + photos.length) % photos.length;
    if (n === index) return;
    const frames = carousel.querySelectorAll('.cframe');
    if (frames.length !== photos.length){ index = n; draw(); return; }
    const from = frames[index], to = frames[n];
    index = n;
    const token = ++goToken;
    const img = to.querySelector('img');
    const ready = (img && img.decode) ? img.decode().catch(() => {}) : Promise.resolve();
    // attend que l'image soit décodée (max 250 ms) pour un fondu sans à-coup
    Promise.race([ready, new Promise(r => setTimeout(r, 250))]).then(() => {
      if (token !== goToken) return;
      const shown = carousel.querySelector('.cframe.current') || from;
      carousel.querySelectorAll('.cframe').forEach(f => { f.classList.remove('prev'); f.classList.remove('current'); });
      if (shown !== to) shown.classList.add('prev');
      to.classList.add('current');
      clearTimeout(prevTimer);
      prevTimer = setTimeout(() => { if (token === goToken) shown.classList.remove('prev'); }, 950);
    });
    document.getElementById('carouselCount').textContent = (index + 1) + ' / ' + photos.length;
    updateReorderBtns();
    updateNav();
    if (window._refreshPrintBtn) window._refreshPrintBtn();
  }

  // Vignettes
  function closeThumbs(){
    const g = carousel.querySelector('.thumbs');
    if (g) g.remove();
    const t = document.getElementById('sfThumbs'); if (t) t.textContent = 'Show thumbnails';
  }
  function toggleThumbs(){
    if (carousel.querySelector('.thumbs')){ closeThumbs(); return; }
    if (!photos.length) return;
    const g = document.createElement('div');
    g.className = 'thumbs';
    photos.forEach((ph, k) => {
      const b = document.createElement('button');
      if (k === index) b.className = 'on';
      b.setAttribute('aria-label', seriesName + ' ' + (k + 1));
      b.style.animationDelay = Math.min(k * 35, 500) + 'ms';
      const im = document.createElement('img');
      im.src = ph.src; im.alt = ''; im.decoding = 'async'; im.draggable = false;
      b.appendChild(im);
      b.addEventListener('click', (e) => { e.stopPropagation(); window._lbFromThumbs = true; openLightbox(photos, k); });
      g.appendChild(b);
    });
    carousel.appendChild(g);
    // Mosaïque en colonnes (façon planche d'expo) : grandes vignettes, proportions réelles, on peut descendre
    const btnsAll = Array.from(g.querySelectorAll('button'));
    const ratio = b => { const im = b.querySelector('img'); return (im && im.naturalWidth) ? im.naturalWidth / im.naturalHeight : 1.5; };
    let lastCols = 0;
    const justify = () => {
      if (!g.isConnected) { window.removeEventListener('resize', justify); return; }
      const W = g.clientWidth;
      const n = W < 1000 ? 2 : 3;
      g.innerHTML = '';
      g.classList.add('masonry');
      const cols = [], heights = [];
      for (let i = 0; i < n; i++){ const c = document.createElement('div'); c.className = 'm-col'; g.appendChild(c); cols.push(c); heights.push(0); }
      btnsAll.forEach(b => {
        let k = 0; for (let i = 1; i < n; i++) if (heights[i] < heights[k] - 0.01) k = i;
        b.style.width = ''; b.style.height = '';
        cols[k].appendChild(b); heights[k] += 1 / ratio(b);
      });
      lastCols = n;
    };
    Promise.all(Array.from(g.querySelectorAll('img')).map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; }))).then(justify);
    justify();
    window.addEventListener('resize', justify);
    const t = document.getElementById('sfThumbs'); if (t) t.textContent = 'Hide thumbnails';
  }
  window._carouselCtl = {
    prev: () => { closeThumbs(); go(index - 1); },
    next: () => { closeThumbs(); go(index + 1); },
    thumbs: toggleThumbs,
    closeThumbs,
    goTo: (k) => { if (k !== index && photos[k]){ index = k; draw(); } },
    // après le plein écran ouvert depuis les vignettes : on reste sur la grille, calé sur la dernière photo vue
    syncIndex: (k) => {
      if (!photos[k]) return;
      index = k;
      carousel.querySelectorAll('.cframe').forEach((f, i) => { f.classList.remove('prev'); f.classList.toggle('current', i === k); });
      carousel.querySelectorAll('.thumbs button').forEach((b, i) => b.classList.toggle('on', i === k));
      updateNav(); updateReorderBtns();
      if (window._refreshPrintBtn) window._refreshPrintBtn();
    }
  };

  // Dots + counter
  const dotsEl = document.createElement('div');
  dotsEl.className = 'c-dots';
  carousel.appendChild(dotsEl);
  const counterEl = document.createElement('div');
  counterEl.className = 'c-counter';
  carousel.appendChild(counterEl);


  // Zones de clic directionnel — curseur seul, pas de flèche
  const zoneL = document.createElement('div');
  zoneL.className = 'carousel-zone left';
  zoneL.addEventListener('click', () => go(index - 1));
  carousel.appendChild(zoneL);
  const zoneR = document.createElement('div');
  zoneR.className = 'carousel-zone right';
  zoneR.addEventListener('click', () => go(index + 1));
  carousel.appendChild(zoneR);

  function updateNav(){
    dotsEl.innerHTML = '';
    if(photos.length > 1){
      photos.forEach((_, k) => {
        const d = document.createElement('div');
        d.className = 'c-dot' + (k === index ? ' on' : '');
        dotsEl.appendChild(d);
      });
      const el = carousel.querySelector('.c-counter');
      if(el) el.textContent = (index + 1) + ' / ' + photos.length;
      const sc = document.getElementById('sfCount'); if (sc) sc.textContent = fmtCount(index + 1, photos.length);
      // Précharger voisins
      [index + 1, index - 1].forEach(j => {
        const k = (j + photos.length) % photos.length;
        if (photos[k] && k !== index){ const pre = new Image(); pre.src = photos[k].src; }
      });
    } else {
      const el = carousel.querySelector('.c-counter');
      if(el) el.textContent = '';
      const sc = document.getElementById('sfCount'); if (sc) sc.textContent = photos.length ? fmtCount(1, 1) : '';
    }
  }

  // Clavier ← →
  function onKeyDown(e){
    if (document.getElementById('lightbox').classList.contains('open')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tg = e.target;
    if (tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))) return;
    const k = e.key.toLowerCase();
    if (k === 't'){ e.preventDefault(); toggleThumbs(); return; }
    if (k === 'f' && photos.length){ e.preventDefault(); closeThumbs(); window._lbFromCarousel = true; openLightbox(photos, index); return; }
    if (e.key === 'Escape' && carousel.querySelector('.thumbs')){ closeThumbs(); return; }
    if (carousel.querySelector('.thumbs')) return;
    if (e.key === 'ArrowRight') go(index + 1);
    if (e.key === 'ArrowLeft') go(index - 1);
  }
  document.addEventListener('keydown', onKeyDown);

  // Swipe tactile
  let touchStartX = 0;
  carousel.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  carousel.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) < 40) return;
    go(dx < 0 ? index + 1 : index - 1);
  });

  // Nettoyage au changement de vue
  const _origSelectView = typeof _carouselCleanup !== 'undefined' ? null : null;
  if (!window._carouselKeyListeners) window._carouselKeyListeners = [];
  window._carouselKeyListeners.forEach(fn => document.removeEventListener('keydown', fn));
  window._carouselKeyListeners = [onKeyDown];

  function updateReorderBtns(){
    const btnL = document.getElementById('reorderLeft');
    const btnR = document.getElementById('reorderRight');
    if (!btnL || !btnR) return;
    btnL.disabled = photos.length < 2 || index === 0;
    btnR.disabled = photos.length < 2 || index === photos.length - 1;
  }

  const origDraw = draw;
  draw = function(){
    origDraw();
    if (window._refreshPrintBtn) window._refreshPrintBtn();
    { const t = document.getElementById('sfThumbs'); if (t) t.textContent = 'Show thumbnails'; }
    updateReorderBtns();
    updateNav();
  };

  document.getElementById('reorderLeft').addEventListener('click', async (e) => {
    e.stopPropagation();
    if (index === 0) return;
    [photos[index - 1], photos[index]] = [photos[index], photos[index - 1]];
    index--;
    await updatePhotoMeta(photos[index].id, { order: index });
    await updatePhotoMeta(photos[index + 1].id, { order: index + 1 });
    draw();
  });

  document.getElementById('reorderRight').addEventListener('click', async (e) => {
    e.stopPropagation();
    if (index === photos.length - 1) return;
    [photos[index], photos[index + 1]] = [photos[index + 1], photos[index]];
    index++;
    await updatePhotoMeta(photos[index].id, { order: index });
    await updatePhotoMeta(photos[index - 1].id, { order: index - 1 });
    draw();
  });

  const addBtn = document.getElementById('carouselAddBtn');
  // Champ fichier hors du bouton (évite le clic qui se renvoie sur lui-même)
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif,.heic,.heif';
  input.multiple = true;
  input.style.display = 'none';
  document.querySelectorAll('input[data-upl]').forEach(n => n.remove());
  input.dataset.upl = '1';
  document.body.appendChild(input);

  const UPLOAD_MSG = {
    too_large: 'Fichier trop lourd (20 Mo max)',
    unsupported_type: 'Format non accepté',
    quota_or_state: 'Espace de stockage plein',
    rate_limited: 'Trop d\'envois — attends un instant',
    upstream_auth: 'Session expirée — recharge la page',
    not_granted: 'Envoi non autorisé dans cette vue',
    capability_disabled: 'Envoi indisponible ici',
    capability_removed: 'Envoi indisponible ici',
    store_unavailable: 'Serveur indisponible — réessaie',
    invalid_request: 'Fichier illisible'
  };
  const isHeic = f => /\.(heic|heif)$/i.test(f.name) || /hei[cf]/i.test(f.type);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function uploadOne(file){
    if (isHeic(file)) throw { code:'heic' };
    let blob;
    try { blob = await resizeToBlob(file); }
    catch(e){ throw { code:'decode' }; }
    let uploaded;
    try { uploaded = await _assets.upload(blob); }
    catch(e){
      if (e && e.code === 'store_unavailable'){ await sleep(1500); uploaded = await _assets.upload(blob); }
      else throw e;
    }
    const photoData = { id: genId(), assetId: uploaded.id, src: '/_blob/' + uploaded.id, series: seriesName, place:'', year:'', createdAt: Date.now(), order: photos.length };
    const ok = await addPhoto(seriesName, photoData);
    if (ok === false){
      try { await _assets.delete(uploaded.id); } catch(_){}
      throw { code:'db' };
    }
    return photoData;
  }

  function errLabel(err){
    const c = err && err.code;
    if (c === 'heic') return 'Format HEIC (iPhone) non lisible — exporte en JPEG';
    if (c === 'decode') return 'Image illisible par le navigateur';
    if (c === 'db') return 'Photo non enregistrée — réessaie';
    return UPLOAD_MSG[c] || 'Erreur d\'envoi — réessaie';
  }

  let busy = false;
  input.addEventListener('change', async () => {
    const files = Array.from(input.files || []);
    input.value = '';
    if (!files.length || busy) return;
    if (!_canWrite){ addBtn.textContent = 'Connecte-toi pour ajouter des photos'; return; }
    busy = true;
    addBtn.classList.remove('error');
    let done = 0; const errors = [];
    for (let i = 0; i < files.length; i++){
      addBtn.textContent = files.length > 1 ? `Envoi ${i+1}/${files.length}…` : 'Envoi…';
      try {
        const pd = await uploadOne(files[i]);
        photos = [...photos, pd];
        index = photos.length - 1;
        done++;
        draw();
      } catch(err){
        console.error('Upload', files[i].name, err);
        errors.push(errLabel(err));
        if (err && err.code === 'rate_limited') break;
      }
    }
    busy = false;
    if (errors.length){
      const msg = errors[0] + (files.length > 1 ? ` (${done}/${files.length} envoyée${done>1?'s':''})` : '');
      addBtn.textContent = msg;
      addBtn.classList.add('error');
      setTimeout(() => { if (!busy){ addBtn.textContent = '+ Ajouter une photo'; addBtn.classList.remove('error'); } }, 6000);
    } else {
      addBtn.textContent = '+ Ajouter une photo';
    }
  });

  if (!_canWrite){ addBtn.style.display = 'none'; }

  // Bouton « tirages » (visible par le propriétaire seulement)
  const printBtn = document.createElement('button');
  printBtn.className = 'add-btn print-toggle';
  addBtn.parentNode.insertBefore(printBtn, addBtn);
  if (!_canWrite) printBtn.style.display = 'none';
  function refreshPrintBtn(){
    const ph = photos[index];
    const list = _printsCache || [];
    const inList = ph && list.some(it => it.id === ph.id);
    printBtn.textContent = inList ? '✓ Dans les tirages' : '+ Ajouter aux tirages';
    printBtn.classList.toggle('on', !!inList);
    printBtn.style.visibility = ph ? '' : 'hidden';
  }
  window._refreshPrintBtn = refreshPrintBtn;
  loadPrints().then(refreshPrintBtn);
  printBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const ph = photos[index]; if (!ph) return;
    const list = (await loadPrints()).slice();
    const at = list.findIndex(it => it.id === ph.id);
    if (at >= 0){ list.splice(at, 1); }
    else {
      list.push({ id: ph.id, src: ph.src, series: seriesName, title: '' });
    }
    printBtn.textContent = 'Enregistrement…';
    const ok = await savePrints(list);
    refreshPrintBtn();
    if (!ok){ printBtn.textContent = 'Erreur — réessaie'; setTimeout(refreshPrintBtn, 3000); }
  });
  addBtn.addEventListener('click', (e) => { e.stopPropagation(); if (!busy) input.click(); });

  draw();
}

// ── Textures procédurales pour la pièce (parquet + mur) ──
let _floorTex = null, _wallTex = null;
function _rng(seed){ return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function getFloorTex(){
  if (_floorTex) return _floorTex;
  // béton ciré clair : grain fin + nuages doux + micro-taches
  const W = 768, c = document.createElement('canvas'); c.width = W; c.height = W;
  const x = c.getContext('2d'), r = _rng(21), img = x.createImageData(W, W), d = img.data;
  for (let i = 0; i < d.length; i += 4){
    const n = (r() - 0.5) * 14;
    d[i] = 196 + n; d[i+1] = 192 + n; d[i+2] = 186 + n; d[i+3] = 255;
  }
  x.putImageData(img, 0, 0);
  for (let k = 0; k < 70; k++){
    const gx = r() * W, gy = r() * W, rad = 40 + r() * 180;
    const g = x.createRadialGradient(gx, gy, 0, gx, gy, rad);
    const a = 0.06 * r();
    g.addColorStop(0, r() > 0.45 ? 'rgba(255,252,246,' + a + ')' : 'rgba(90,82,72,' + a + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, W);
  }
  for (let k = 0; k < 900; k++){
    x.fillStyle = 'rgba(80,72,62,' + (0.05 + r() * 0.12) + ')';
    x.fillRect(r() * W, r() * W, 1 + r() * 1.5, 1 + r() * 1.5);
  }
  _floorTex = c.toDataURL('image/jpeg', 0.88);
  return _floorTex;
}
function getWallTex(){
  if (_wallTex) return _wallTex;
  const W = 512, c = document.createElement('canvas'); c.width = W; c.height = W;
  const x = c.getContext('2d'), r = _rng(13), img = x.createImageData(W, W), d = img.data;
  for (let i = 0; i < d.length; i += 4){
    const n = (r() - 0.5) * 7;
    d[i] = 238 + n; d[i+1] = 235 + n; d[i+2] = 229 + n; d[i+3] = 255;
  }
  x.putImageData(img, 0, 0);
  // taches très douces (enduit)
  for (let k = 0; k < 40; k++){
    const gx = r() * W, gy = r() * W, rad = 30 + r() * 90;
    const g = x.createRadialGradient(gx, gy, 0, gx, gy, rad);
    const a = 0.025 * r();
    g.addColorStop(0, r() > 0.5 ? 'rgba(255,255,255,' + a + ')' : 'rgba(120,110,95,' + a + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, W);
  }
  _wallTex = c.toDataURL('image/jpeg', 0.9);
  return _wallTex;
}

const FRAME_STYLES = { black:'Black', oak:'Oak', walnut:'Walnut', white:'White' };
const FRAME_FR = { black:'Noir', oak:'Chêne', walnut:'Noyer', white:'Blanc' };
const _frameAuto = {};
function autoFrame(src){
  if (_frameAuto[src]) return _frameAuto[src];
  _frameAuto[src] = new Promise(res => {
    const im = new Image();
    im.onload = () => {
      try{
        const c = document.createElement('canvas'); c.width = 24; c.height = 24;
        const x = c.getContext('2d'); x.drawImage(im, 0, 0, 24, 24);
        const d = x.getImageData(0, 0, 24, 24).data;
        let r = 0, g = 0, b = 0, n = d.length / 4;
        for (let i = 0; i < d.length; i += 4){ r += d[i]; g += d[i+1]; b += d[i+2]; }
        r /= n; g /= n; b /= n;
        const L = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
        const warm = r - b;
        // photo chaude et lumineuse -> chêne ; chaude et sombre -> noyer ;
        // froide et claire -> blanc ; sinon -> noir
        if (warm > 18 && L >= 0.42) res('oak');
        else if (warm > 18) res('walnut');
        else if (L >= 0.58) res('white');
        else res('black');
      } catch(e){ res('black'); }
    };
    im.onerror = () => res('black');
    im.src = src;
  });
  return _frameAuto[src];
}
function applyFrame(el, style){

  orderBtn.addEventListener('click', async (ev) => {
    const cfg = _payCfg || await loadPayCfg();
    const link = cfg.links && cfg.links[+fmt.value];
    if (validPayLink(link)){
      const u = link.trim() + (link.indexOf('?') >= 0 ? '&' : '?') + 'client_reference_id=' + encodeURIComponent(printRef(it));
      // Ouvre Stripe dans un nouvel onglet, sans jamais faire quitter sa page au site
      const a = document.createElement('a');
      a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.style.display = 'none';
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    mailOrder();
  });
  function mailOrder(){
    const f = PRINT_FORMATS[+fmt.value];
    const q = Math.max(1, Math.min(10, parseInt(qty.value, 10) || 1));
    const subject = 'Print order — ' + printTitle(it) + ' (' + seriesTitle(it.series) + ')';
    const body = 'Hello Alexandre,\n\nI would like to order the following print:\n\n' +
      '— Photograph: ' + printTitle(it) + ' (' + seriesTitle(it.series) + ', ref. ' + (it.src || '').split('/').pop().slice(0, 8) + ')\n' +
      '— Format: ' + f[0] + '\n' +
      '— Quantity: ' + q + '\n' +
      '— Price: €' + (f[1] * q) + ' (frame not included)\n\n' +
      'Name:\nDelivery address:\nPhone:\n\nThank you.';
    window.location.href = 'mailto:' + PRINT_EMAIL + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  }
  // Panneau propriétaire : liens Stripe
  const adm = document.getElementById('pdAdmin');
  if (adm){
    loadPayCfg().then(cfg => adm.querySelectorAll('input[data-i]').forEach(inp => { inp.value = (cfg.links && cfg.links[+inp.dataset.i]) || ''; }));
    document.getElementById('pdPaySave').addEventListener('click', async () => {
      const msg = document.getElementById('pdPayMsg');
      const links = [];
      let bad = false;
      adm.querySelectorAll('input[data-i]').forEach(inp => {
        const v = inp.value.trim();
        if (v && !validPayLink(v)){ bad = true; inp.classList.add('bad'); } else inp.classList.remove('bad');
        links[+inp.dataset.i] = v;
      });
      if (bad){ msg.textContent = 'Lien invalide : il doit commencer par https://buy.stripe.com/'; return; }
      msg.textContent = 'Enregistrement…';
      const ok = await savePayCfg(Object.assign({}, await loadPayCfg(), { links }));
      msg.textContent = ok ? 'Enregistré ✓' : 'Erreur — réessaie';
      applyPayMode(_payCfg);
    });
  }
  document.getElementById('pdBack').addEventListener('click', renderPrintsPage);
  bindLang(() => renderPrintDetail(it));
  const ed = document.getElementById('pdEdit');
  if (ed) ed.addEventListener('click', () => {
    const h = content.querySelector('.pd-title');
    const inp = document.createElement('input');
    inp.type = 'text'; inp.value = hasOwnTitle(it) ? it.title : ''; inp.placeholder = 'Untitled'; inp.className = 'pd-title-input';
    h.replaceWith(inp); inp.focus(); inp.select();
    let done = false;
    async function commit(save){
      if (done) return; done = true;
      const t = inp.value.trim();
      if (!save || t === (it.title || '')){ renderPrintDetail(it); return; }
      const list = (await loadPrints()).map(x => x.id === it.id ? Object.assign({}, x, { title: t }) : x);
      await savePrints(list);
      renderPrintDetail(list.find(x => x.id === it.id));
    }
    inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') commit(true); if (e.key === 'Escape') commit(false); });
    inp.addEventListener('blur', () => commit(true));
  });
  const rm = document.getElementById('pdRemove');
  if (rm) rm.addEventListener('click', async () => {
    if (!rm.dataset.armed){
      rm.dataset.armed = '1'; rm.textContent = 'Confirmer le retrait ? (la photo reste dans sa série)';
      setTimeout(() => { if (rm.isConnected){ delete rm.dataset.armed; rm.textContent = 'Retirer des tirages'; } }, 4000);
      return;
    }
    await savePrints((await loadPrints()).filter(x => x.id !== it.id));
    renderPrintsPage();
  });
}
document.addEventListener('keydown', (e) => {
  if (currentKey === '__prints__' && e.key === 'Escape' && document.getElementById('pdBack')) renderPrintsPage();
});

(function(){
  if (!window.matchMedia || !window.matchMedia('(pointer:fine)').matches) return;
  const c = document.createElement('div');
  c.id = 'czCursor';
  c.innerHTML = '<svg viewBox="0 0 22 10" width="22" height="10"><path class="cz-l" d="M21.5 5H0.8M4.4 1.6L0.8 5l3.6 3.4"/><path class="cz-r" d="M0.5 5h20.7M17.6 1.6L21.2 5l-3.6 3.4"/></svg>';
  document.body.appendChild(c);
  let x = -100, y = -100, tx = -100, ty = -100, raf = null, shown = false;
  function loop(){
    x += (tx - x) * 0.32; y += (ty - y) * 0.32;
    c.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
    if (Math.abs(tx - x) > 0.2 || Math.abs(ty - y) > 0.2) raf = requestAnimationFrame(loop); else raf = null;
  }
  document.addEventListener('mousemove', (e) => {
    tx = e.clientX; ty = e.clientY;
    const z = e.target && e.target.closest ? e.target.closest('.carousel-zone') : null;
    if (z){
      if (!shown){ x = tx; y = ty; }
      c.dataset.side = z.classList.contains('left') ? 'l' : 'r';
      c.classList.add('on'); shown = true;
    } else if (shown){ c.classList.remove('on'); shown = false; }
    if (!raf) raf = requestAnimationFrame(loop);
  }, { passive:true });
  document.addEventListener('mouseleave', () => { c.classList.remove('on'); shown = false; });
  document.addEventListener('mousedown', () => { if (shown){ c.classList.add('press'); setTimeout(() => c.classList.remove('press'), 160); } });
})();

let _splashCanvas = null;

function startSplashCanvas(){
  const bg = document.getElementById('splash-bg');
  if(!bg) return null;
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:0;';
  bg.insertBefore(canvas, bg.firstChild);
  const ctx = canvas.getContext('2d');
  let w = 0, h = 0, orbs = [], streaks = [], raf = null, stopped = false, t = 0;

  const PALETTE = [
    [255, 210, 120], // warm amber
    [255, 180,  60], // golden
    [200, 220, 255], // cool blue
    [255, 255, 255], // white
    [255, 140,  80], // orange
    [160, 200, 255], // icy blue
    [255, 230, 160], // soft yellow
  ];

  function resize(){
    w = canvas.width = bg.offsetWidth || window.innerWidth;
    h = canvas.height = bg.offsetHeight || window.innerHeight;
    // Big bokeh orbs — like street lamps out of focus
    orbs = Array.from({length: 28}, () => {
      const col = PALETTE[Math.floor(Math.random() * PALETTE.length)];
      const isBig = Math.random() < 0.35;
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        r: isBig ? Math.random() * 120 + 60 : Math.random() * 40 + 12,
        col,
        baseAlpha: isBig ? Math.random() * 0.18 + 0.04 : Math.random() * 0.45 + 0.12,
        phase: Math.random() * Math.PI * 2,
        freq: Math.random() * 0.008 + 0.002,
        vy: (Math.random() - 0.5) * 0.06,
        vx: (Math.random() - 0.5) * 0.04,
      };
    });
    // Light streaks — like car trails
    streaks = Array.from({length: 6}, () => ({
      x: Math.random() * w,
      y: Math.random() * h * 0.6 + h * 0.2,
      len: Math.random() * 180 + 60,
      alpha: Math.random() * 0.12 + 0.03,
      col: PALETTE[Math.floor(Math.random() * 3)], // warm only
      angle: (Math.random() - 0.5) * 0.08,
      speed: Math.random() * 0.4 + 0.15,
    }));
  }

  function draw(){
    if(stopped) return;
    t++;
    // Dark base — repaint each frame with slight trail
    ctx.fillStyle = 'rgba(5,5,14,0.22)';
    ctx.fillRect(0, 0, w, h);

    // Bokeh orbs
    orbs.forEach(o => {
      o.phase += o.freq;
      o.x += o.vx; o.y += o.vy;
      if(o.x < -o.r * 2) o.x = w + o.r;
      if(o.x > w + o.r * 2) o.x = -o.r;
      if(o.y < -o.r * 2) o.y = h + o.r;
      if(o.y > h + o.r * 2) o.y = -o.r;
      const alpha = o.baseAlpha * (0.6 + 0.4 * Math.sin(o.phase));
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
      const [r,gr,b] = o.col;
      g.addColorStop(0,   `rgba(${r},${gr},${b},${(alpha).toFixed(3)})`);
      g.addColorStop(0.5, `rgba(${r},${gr},${b},${(alpha * 0.25).toFixed(3)})`);
      g.addColorStop(1,   `rgba(${r},${gr},${b},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Light streaks
    streaks.forEach(s => {
      s.x += s.speed;
      if(s.x > w + s.len) s.x = -s.len;
      const [r,gr,b] = s.col;
      const gx = ctx.createLinearGradient(s.x, s.y, s.x + s.len, s.y + s.len * s.angle);
      gx.addColorStop(0, `rgba(${r},${gr},${b},0)`);
      gx.addColorStop(0.4, `rgba(${r},${gr},${b},${s.alpha.toFixed(3)})`);
      gx.addColorStop(1, `rgba(${r},${gr},${b},0)`);
      ctx.strokeStyle = gx;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + s.len, s.y + s.len * s.angle);
      ctx.stroke();
    });

    raf = requestAnimationFrame(draw);
  }

  // First frame: fill dark so no flash
  resize();
  ctx.fillStyle = 'rgb(5,5,14)';
  ctx.fillRect(0, 0, w, h);
  draw();

  const ro = new ResizeObserver(resize);
  ro.observe(bg);

  return {
    stop(){ stopped = true; if(raf) cancelAnimationFrame(raf); ro.disconnect(); canvas.remove(); }
  };
}

  splash.style.display = 'flex';

    const bg = document.getElementById('splash-bg');

      slide.className = 'splash-slide';

      const blur = document.createElement('img');
      blur.src = p.src; blur.className = 'sp-blur'; blur.alt = '';
      slide.appendChild(blur);
      const img = document.createElement('img');
      img.src = p.src; img.className = 'sp-main';

          const L = edge(0), R = edge(img.naturalWidth * 0.99);
          slide.style.background = L.replace('linear-gradient(180deg,', 'linear-gradient(180deg,') ;

          fl.className = 'sp-fade'; fr.className = 'sp-fade';
          fl.style.background = L; fr.style.background = R;
          fl.style.webkitMaskImage = fl.style.maskImage = 'linear-gradient(90deg, #000 0%, rgba(0,0,0,0) 100%)';
          fr.style.webkitMaskImage = fr.style.maskImage = 'linear-gradient(270deg, #000 0%, rgba(0,0,0,0) 100%)';
          slide.appendChild(fl); slide.appendChild(fr);
          const fades = () => {
            const W = slide.clientWidth, Hh = slide.clientHeight;
            const s0 = Math.min(W / img.naturalWidth, Hh / img.naturalHeight), z = p.zoom || 1;
            const oyb = (Hh - img.naturalHeight * s0) / 2 + img.naturalHeight * s0; // bas de la photo
            img.style.transformOrigin = '50% ' + (oyb / Hh * 100).toFixed(2) + '%';
            img.style.transform = z !== 1 ? 'scale(' + z + ')' : '';
            const s = s0 * z, rw = img.naturalWidth * s, ox = (W - rw) / 2;
            const fw = Math.max(0, Math.min(rw * 0.08, 140));
            fl.style.display = fr.style.display = ox > 1 ? '' : 'none';
            fl.style.left = Math.floor(ox - 1) + 'px'; fl.style.width = fw + 'px';
            fr.style.left = Math.ceil(ox + rw - fw + 1) + 'px'; fr.style.width = fw + 'px';
          };
          fades(); window.addEventListener('resize', fades);
          // Symétrie : le texte se place en miroir du sujet, le nom à hauteur du geste
          if (p.mirrorX){
            const place = () => {
              const sp = document.getElementById('splash'), ct = sp && sp.querySelector('.splash-content'), nm = ct && ct.querySelector('.splash-name');
              if (!ct || !nm) return;
              const W = sp.clientWidth, Hh = sp.clientHeight;
              if (W < Hh){ ct.removeAttribute('style'); return; }
              const s0 = Math.min(W / img.naturalWidth, Hh / img.naturalHeight), z = p.zoom || 1;
              const oyb = (Hh - img.naturalHeight * s0) / 2 + img.naturalHeight * s0;
              const s = s0 * z, rw = img.naturalWidth * s, rh = img.naturalHeight * s;
              const ox = (W - rw) / 2, oy = oyb - rh;
              sp.classList.add('sp-side');
              // centre du texte = milieu exact de l'espace libre à droite du joueur (marges égales des deux côtés)
              const freeL = ox + rw * (p.subjectRight || p.mirrorX), freeR = Math.min(W, ox + rw);
              const cx = p.subjectRight ? (freeL + freeR) / 2 : ox + rw * p.mirrorX, ny = oy + rh * p.nameY;
              ct.style.right = 'auto'; ct.style.bottom = 'auto'; ct.style.width = 'max-content';
              ct.style.left = Math.round(cx - ct.offsetWidth / 2) + 'px';
              ct.style.top = Math.round(ny - (nm.offsetTop + nm.offsetHeight / 2)) + 'px';
              const ov = sp.querySelector('.splash-overlay');
              sp.classList.toggle('sp-dark', !!p.dark);
              if (ov && p.dark) ov.style.setProperty('background', 'transparent', 'important');
              else if (ov) ov.style.setProperty('background', 'radial-gradient(ellipse 30% 26% at ' + (cx / W * 100).toFixed(1) + '% ' + ((ny + 40) / Hh * 100).toFixed(1) + '%, rgba(0,0,0,' + (p.veil || 0.28) + '), rgba(0,0,0,0) 100%), linear-gradient(rgba(0,0,0,0.10), rgba(0,0,0,0.10))', 'important');
            };
            place();
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
            window.addEventListener('resize', place);
          }
        } catch(e){}
      });
      slide.appendChild(img);
      bg.appendChild(slide);
    });
    if(pool.length < 2) return;
    let si = 0;
    const splashTimer = setInterval(() => {
      const sp = document.getElementById('splash');
      if(!sp || sp.classList.contains('hidden')){ clearInterval(splashTimer); return; }
      const slides = bg.querySelectorAll('.splash-slide');
      slides[si].classList.remove('current');
      si = (si + 1) % slides.length;
      slides[si].classList.add('current');
    }, 5500);
  }catch(e){ console.error('splash err', e); }
}

function hideSplash(instant){
  const splash = document.getElementById('splash');
  if(!splash) return;
  if(instant){
    splash.style.display='none';
    if(_splashCanvas){ _splashCanvas.stop(); _splashCanvas = null; }
    return;
  }
  splash.classList.add('hidden');
  setTimeout(() => {
    splash.style.display='none';
    if(_splashCanvas){ _splashCanvas.stop(); _splashCanvas = null; }
  }, 950);
}

function enterSite(){
  hideSplash(false);
}
// Entrer d'un clic n'importe où, ou avec la touche Entrée / Espace
(function(){
  const sp = document.getElementById('splash');
  // Clic sur toute l'image désactivé : on entre uniquement via le bouton Enter

  document.addEventListener('keydown', (e) => {
    const s = document.getElementById('splash');
    if (s && s.style.display !== 'none' && !s.classList.contains('hidden') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); enterSite(); }
  });
})();

// ── Lightbox ─────────────────────────────────────────────────────────────────
let _lbPhotos = [];
let _lbIdx = 0;

function openLightbox(photos, idx){
  _lbPhotos = photos;
  _lbIdx = idx;
  const lb = document.getElementById('lightbox');
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  lbShow();
  document.addEventListener('keydown', onLbKey);
}

function closeLightbox(){
  const lb = document.getElementById('lightbox');
  lb.classList.remove('open');
  document.body.style.overflow = '';
  document.removeEventListener('keydown', onLbKey);
  if (window._lbFromThumbs && window._carouselCtl && window._carouselCtl.syncIndex) window._carouselCtl.syncIndex(_lbIdx);
  else if (window._lbFromCarousel && window._carouselCtl && window._carouselCtl.goTo) window._carouselCtl.goTo(_lbIdx);
  window._lbFromThumbs = false;
  window._lbFromCarousel = false;
}

function lbShow(){
  if(!_lbPhotos.length) return;
  const p = _lbPhotos[_lbIdx];
  document.getElementById('lbImg').src = p.src;
  const parts = [p.place, p.year].filter(Boolean).join(', ');
  document.getElementById('lbCaption').textContent =
    parts ? parts + ' — ' + (_lbIdx + 1) + ' / ' + _lbPhotos.length
          : (_lbIdx + 1) + ' / ' + _lbPhotos.length;
  const single = _lbPhotos.length < 2;
  document.getElementById('lb-prev').style.display = single ? 'none' : '';
  document.getElementById('lb-next').style.display = single ? 'none' : '';
}

function onLbKey(e){
  if(e.key === 'Escape' || ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey)){ closeLightbox(); return; }
  if(e.key === 'ArrowRight'){ _lbIdx = (_lbIdx + 1) % _lbPhotos.length; lbShow(); }
  if(e.key === 'ArrowLeft'){ _lbIdx = (_lbIdx - 1 + _lbPhotos.length) % _lbPhotos.length; lbShow(); }
}

(function initLightbox(){
  const lb = document.getElementById('lightbox');
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lb-prev').addEventListener('click', (e) => {
    e.stopPropagation();
    _lbIdx = (_lbIdx - 1 + _lbPhotos.length) % _lbPhotos.length;
    lbShow();
  });
  document.getElementById('lb-next').addEventListener('click', (e) => {
    e.stopPropagation();
    _lbIdx = (_lbIdx + 1) % _lbPhotos.length;
    lbShow();
  });
  // Click on image or background closes
  lb.addEventListener('click', (e) => {
    if(e.target === lb || e.target === document.getElementById('lbImg')) closeLightbox();
  });
  // Swipe in lightbox
  let lbTouchX = 0;
  lb.addEventListener('touchstart', e => { lbTouchX = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - lbTouchX;
    if(Math.abs(dx) < 40 || _lbPhotos.length < 2) return;
    if(dx < 0){ _lbIdx = (_lbIdx + 1) % _lbPhotos.length; }
    else { _lbIdx = (_lbIdx - 1 + _lbPhotos.length) % _lbPhotos.length; }
    lbShow();
  });
})();

// Accueil : pose « PHOTOGRAPHER » sur la ligne d'horizon de la photo (Beyrouth n°4 élargie, 1897×1067, horizon à y=489, cadrage cover centré 55 %)
// ⚠ Si la photo d'accueil change, passer SPLASH_HORIZON à false.
(function(){
  const SPLASH_HORIZON = true;
  const IW = 1897, IH = 1067, HY = 489, POS = 0.55, GAP = 7;
  function place(){
    if (!SPLASH_HORIZON) return;
    const sp = document.getElementById('splash');
    const c = sp && sp.querySelector('.splash-content');
    if (!c || sp.classList.contains('sp-side')) return;
    // sur téléphone, autre photo : pas de calage sur l'horizon de Beyrouth
    if (window.innerWidth <= 700){ c.style.removeProperty('top'); c.style.removeProperty('bottom'); return; }
    const W = window.innerWidth, H = window.innerHeight;
    const s = Math.max(W / IW, H / IH);
    const hy = HY * s - (IH * s - H) * POS;           // hauteur de l'horizon à l'écran
    const sub = c.querySelector('.splash-sub');
    // mesures de mise en page (offsetTop/offsetHeight) : insensibles aux animations d'apparition
    const extra = sub ? Math.max(0, c.offsetHeight - (sub.offsetTop + sub.offsetHeight)) : 0;
    c.style.setProperty('top', 'auto', 'important');
    c.style.setProperty('bottom', Math.round(H - hy + GAP - extra) + 'px', 'important');
  }
  window.addEventListener('resize', place);
  window.addEventListener('load', place);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', place); else place();
  [100, 400, 1000, 2500].forEach(t => setTimeout(place, t));
})();

// ── Téléphone : en-tête, menu latéral, barre de navigation en bas ──
(function(){
  const mq = window.matchMedia('(max-width:700px)');
  const sb = document.getElementById('sidebar');
  const mt = document.getElementById('menuToggle');
  const sf = document.getElementById('sideFooter');
  const head = document.createElement('div'); head.id = 'mHeader';
  const brand = document.createElement('button'); brand.id = 'mBrand'; brand.type = 'button'; brand.textContent = 'Alexandre Zreik';
  const bd = document.createElement('div'); bd.id = 'mBackdrop';
  document.body.appendChild(head); document.body.appendChild(brand); document.body.appendChild(bd);
  function open(){ sb.classList.add('open'); document.body.classList.add('m-menu'); mt.setAttribute('aria-expanded', 'true'); }
  function close(){ sb.classList.remove('open'); document.body.classList.remove('m-menu'); mt.setAttribute('aria-expanded', 'false'); }
  mt.addEventListener('click', e => { e.stopPropagation(); sb.classList.contains('open') ? close() : open(); });
  bd.addEventListener('click', close);
  brand.addEventListener('click', () => { close(); document.getElementById('logoBtn').click(); window.scrollTo(0, 0); });
  sb.addEventListener('click', e => { if (e.target.closest('.snav-series-btn, .snav-link, #logoBtn')){ setTimeout(close, 60); window.scrollTo(0, 0); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sb.classList.contains('open')) close(); });
  // La barre Prev / Next / vignettes vit dans le menu sur ordinateur, en bas de l'écran sur téléphone
  function place(){
    if (mq.matches){ if (sf.parentElement !== document.body) document.body.appendChild(sf); }
    else {
      if (sf.parentElement !== sb) sb.insertBefore(sf, sb.querySelector('.side-copy'));
      close();
    }
  }
  if (mq.addEventListener) mq.addEventListener('change', place); else mq.addListener(place);
  place();
})();

initStorage()
